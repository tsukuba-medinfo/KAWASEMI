name: 機能要望 / 改善提案
description: 新機能・既存機能の改善を提案する
title: "[feat] "
labels: ["type:feat"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景 / 解決したい課題
      description: なぜ必要か。現状の何が困っているか。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する内容
      description: どう解決するか。UI/API/データの変更点があれば具体的に。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 完了条件（受け入れ基準）
      description: 何が満たされたら closed にできるか。チェックボックスで。
      placeholder: |
        - [ ] ...
        - [ ] テスト追加
        - [ ] ドキュメント更新
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 補足 / 代替案
      description: 関連 issue、参考リンク、検討した代替案など。
