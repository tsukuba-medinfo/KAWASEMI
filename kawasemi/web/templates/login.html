<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - KAWASEMI</title>
    <link rel="icon" type="image/png" sizes="64x64" href="{{ base_path() }}/static/img/favicon-64.png">
    <link rel="apple-touch-icon" href="{{ base_path() }}/static/img/apple-touch-icon.png">
    <link rel="stylesheet" href="{{ base_path() }}/static/css/tokens.css?v={{ static_v('css/tokens.css') }}">
    <link rel="stylesheet" href="{{ base_path() }}/static/css/app.css?v={{ static_v() }}">
    <style>
        /* ログイン画面専用の中央寄せレイアウト（base.html を継承しない独立ページ） */
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { width: 100%; max-width: 400px; margin: 1rem; }
        .login-logo { text-align: center; margin-bottom: 2rem; }
        .login-logo h1 { color: var(--color-ink); font-size: 2rem; margin-bottom: 0.5rem; }
        .login-logo p { color: var(--color-ink-2); font-size: var(--text-sm); }
        .login-footer { margin-top: 1.5rem; text-align: center; color: var(--color-ink-2); font-size: var(--text-xs); }
        .login-container .btn { width: 100%; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card">
            <div class="login-logo">
                <h1>KAWASEMI</h1>
                <p>JASPEHR Questionnaire テンプレート入力システム</p>
            </div>

            {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="{{ base_path() }}/login" id="loginForm">
                {% if csrf_token %}
                <input type="hidden" name="csrf_token" id="csrf_token" value="{{ csrf_token }}">
                {% endif %}
                {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
                {% endif %}

                <div class="form-group">
                    <label for="username">ユーザー名</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">パスワード</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn--primary">ログイン</button>
            </form>

            <div class="login-footer">
                <p>KAWASEMI v0.1.0</p>
            </div>
        </div>
    </div>

    <script>
        // CSRFトークンをヘッダーに追加してフォーム送信
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const form = this;
            const formData = new FormData(form);
            const csrfToken = document.getElementById('csrf_token');

            fetch(form.action, {
                method: 'POST',
                headers: {
                    'X-CSRF-Token': csrfToken ? csrfToken.value : ''
                },
                body: formData,
                credentials: 'same-origin'
            })
            .then(response => {
                if (response.redirected) {
                    window.location.href = response.url;
                } else {
                    return response.text();
                }
            })
            .then(html => {
                if (html) {
                    document.open();
                    document.write(html);
                    document.close();
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('ログインに失敗しました。もう一度お試しください。');
            });
        });
    </script>
</body>
</html>
